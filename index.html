<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>出来れば一致してほしいゲーム</title>
  <style>
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --accent: #ef4444;
      --danger: #dc2626;
      --danger-hover: #b91c1c;
      --secondary: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, 'Hiragino Sans', 'Meiryo';
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header {
      text-align: center;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 1.5rem;
      color: var(--primary);
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border);
    }

    .top-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 600px) {
      .top-grid {
        grid-template-columns: 1fr;
      }
    }

    .input-group {
      display: flex;
      gap: 8px;
    }

    input[type="text"] {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--primary);
    }

    button {
      padding: 10px 18px;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
      white-space: nowrap;
    }

    button:hover:not(:disabled) {
      background-color: var(--primary-hover);
    }

    button:disabled {
      background-color: #cbd5e1;
      cursor: not-allowed;
    }

    button.btn-danger {
      background-color: var(--danger);
    }

    button.btn-danger:hover:not(:disabled) {
      background-color: var(--danger-hover);
    }

    button.btn-secondary {
      background-color: var(--secondary);
    }

    .game-status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .status-info {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .status-info b {
      color: var(--text);
      font-size: 1rem;
    }

    .timer-box {
      text-align: center;
      background: #f1f5f9;
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .timer-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      display: block;
    }

    .timer-value {
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--primary);
    }

    .timer-value.warning {
      color: var(--accent);
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.4; }
      100% { opacity: 1; }
    }

    .prompt-card {
      text-align: center;
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      color: white;
      padding: 24px;
    }

    .prompt-label {
      font-size: 0.85rem;
      opacity: 0.9;
      margin-bottom: 6px;
      letter-spacing: 1px;
    }

    .prompt-title {
      font-size: 1.8rem;
      font-weight: bold;
      word-break: break-all;
    }

    .action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 600px) {
      .action-grid {
        grid-template-columns: 1fr;
      }
    }

    .section-title {
      font-size: 0.85rem;
      font-weight: bold;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .bottom-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 768px) {
      .bottom-grid {
        grid-template-columns: 1fr;
      }
    }

    .player-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .player-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.9rem;
    }

    .player-info {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-badge {
      font-size: 0.75rem;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
    }

    .badge-answered { background: #d1fae5; color: #065f46; }
    .badge-thinking { background: #fef3c7; color: #92400e; }
    .badge-out { background: #fee2e2; color: #991b1b; }
    .badge-giver { background: #e0e7ff; color: #3730a3; }

    pre#log {
      background: #1e293b;
      color: #f1f5f9;
      font-family: monospace;
      font-size: 0.85rem;
      padding: 12px;
      border-radius: 8px;
      height: 180px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .chat-messages {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 8px;
      height: 130px;
      overflow-y: auto;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 8px;
    }

    .chat-item {
      font-size: 0.85rem;
      word-break: break-all;
      line-height: 1.3;
    }

    .chat-author {
      font-weight: bold;
      color: var(--primary);
      margin-right: 4px;
    }

    .chat-time {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-left: 6px;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>出来れば一致してほしいゲーム</h1>
    </header>

    <div class="top-grid">
      <div class="card">
        <div class="section-title">プレイヤー参加</div>
        <div class="input-group">
          <input type="text" id="username" placeholder="プレイヤー名を入力">
          <button id="join-btn" onclick="joinGame()">参加</button>
          <button id="leave-btn" class="btn-danger" onclick="leaveGame()" disabled>退室</button>
        </div>
      </div>

      <div class="card game-status-bar">
        <div class="status-info">
          フェーズ: <b id="phase">-</b><br>
          ラウンド: <b id="round">-</b>
        </div>
        <div class="timer-box">
          <span class="timer-label">残り時間</span>
          <span id="timer-display" class="timer-value">--</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 4px;">
          <button id="start-btn" onclick="startGame()" disabled>ゲーム開始</button>
          <button class="btn-secondary" onclick="resetRoom()" style="font-size: 0.75rem; padding: 4px 8px;">リセット</button>
        </div>
      </div>
    </div>

    <div class="card prompt-card">
      <div class="prompt-label">現在の課題 / お題</div>
      <div class="prompt-title"><b id="prompt-display">-</b></div>
    </div>

    <div class="action-grid">
      <div class="card">
        <div class="section-title">お題作成（出題者用）</div>
        <div class="input-group">
          <input type="text" id="prompt-input" placeholder="お題を入力">
          <button id="prompt-btn" onclick="submitPrompt()">送信</button>
        </div>
      </div>

      <div class="card">
        <div class="section-title">回答入力</div>
        <div class="input-group">
          <input type="text" id="answer-input" placeholder="回答を入力">
          <button id="answer-btn" onclick="submitAnswer()">送信</button>
        </div>
      </div>
    </div>

    <div class="bottom-grid">
      <div class="card">
        <div class="section-title">ステータス</div>
        <ul id="player-list" class="player-list"></ul>
      </div>

      <div class="card">
        <div class="section-title">ゲームログ</div>
        <pre id="log"></pre>
      </div>

      <div class="card">
        <div class="section-title">チャット</div>
        <div id="chat-messages" class="chat-messages"></div>
        <div class="input-group">
          <input type="text" id="chat-input" placeholder="メッセージを入力" onkeypress="handleChatKeyPress(event)">
          <button onclick="sendChatMessage()">送信</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

  <script>
    const TIME_LIMIT_PROMPT = 20;
    const TIME_LIMIT_ANSWER = 25;

    const DEFAULT_PROMPTS = [
      "赤い食べ物といえば？",
      "コンビニで買ってしまうものは？",
      "定番の味噌汁の具といえば？",
      "人気のある冬のスポーツといえば？",
      "映画といえば？",
      "無人島に持っていくなら？"
    ];

    const firebaseConfig = {
      apiKey: "AIzaSyBOzwMVhNaLCdXgDDounnD7_9y3232Mmjc",
      authDomain: "kusogeee-3fe4f.firebaseapp.com",
      databaseURL: "https://kusogeee-3fe4f-default-rtdb.firebaseio.com/",
      projectId: "kusogeee-3fe4f",
      storageBucket: "kusogeee-3fe4f.firebasestorage.app",
      messagingSenderId: "429987463794",
      appId: "1:429987463794:web:1172f8a82433d36bf3f8eb"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function getOrCreatePlayerId() {
      let id = localStorage.getItem('kusogeee_player_id');
      if (!id) {
        id = 'p_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
        localStorage.setItem('kusogeee_player_id', id);
      }
      return id;
    }
    const myPlayerId = getOrCreatePlayerId();

    const gameRef = db.ref('game');
    const playersRef = db.ref('players');
    const chatRef = db.ref('chat');

    let latestGame = null;
    let latestPlayers = {};
    let lastLogSeq = -1;

    // タブ閉じ・切断時にプレイヤーレコード自体を完全削除
    function armDisconnectHook() {
      db.ref('players/' + myPlayerId).onDisconnect().remove();
    }

    gameRef.transaction(current => {
      if (current === null) {
        return {
          phase: 'lobby',
          round: 0,
          prompt: '',
          promptGiverId: null,
          endTime: 0,
          log: '',
          logSeq: 0
        };
      }
      return current;
    });

    gameRef.on('value', snap => {
      latestGame = snap.val() || {};
      render();
      maybeActAsJudge();
    });

    playersRef.on('value', snap => {
      latestPlayers = snap.val() || {};
      render();
      maybeActAsJudge();
    });

    chatRef.limitToLast(50).on('child_added', snapshot => {
      const msg = snapshot.val();
      if (!msg) return;

      const container = document.getElementById('chat-messages');
      const div = document.createElement('div');
      div.className = 'chat-item';

      const timeStr = msg.timestamp
        ? new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        : '';

      div.innerHTML = `
        <span class="chat-author">${escapeHtml(msg.senderName)}:</span>
        <span>${escapeHtml(msg.text)}</span>
        <span class="chat-time">${timeStr}</span>
      `;

      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    });

    function sendChatMessage() {
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text) return;

      const me = latestPlayers[myPlayerId];
      const senderName = (me && me.name) ? me.name : 'ゲスト';

      chatRef.push({
        senderName: senderName,
        text: text,
        timestamp: firebase.database.ServerValue.TIMESTAMP
      }).then(() => {
        input.value = '';
      });
    }

    function handleChatKeyPress(e) {
      if (e.key === 'Enter') {
        sendChatMessage();
      }
    }

    setInterval(() => {
      if (!latestGame || !latestGame.endTime || latestGame.phase === 'lobby' || latestGame.phase === 'game_over') {
        document.getElementById('timer-display').textContent = '--';
        document.getElementById('timer-display').classList.remove('warning');
        return;
      }

      const now = Date.now();
      const remainMs = Math.max(0, latestGame.endTime - now);
      const remainSec = Math.ceil(remainMs / 1000);

      const timerElem = document.getElementById('timer-display');
      timerElem.textContent = remainSec + 's';

      if (remainSec <= 5) {
        timerElem.classList.add('warning');
      } else {
        timerElem.classList.remove('warning');
      }

      if (remainMs <= 0) {
        maybeHandleTimeout();
      }
    }, 250);

    function playersArray() {
      return Object.keys(latestPlayers).map(id => ({ id, ...latestPlayers[id] }));
    }

    function render() {
      if (!latestGame) return;
      document.getElementById('phase').textContent = latestGame.phase || '-';
      document.getElementById('round').textContent = latestGame.round || '-';
      document.getElementById('prompt-display').textContent = latestGame.prompt || '(未設定)';

      const list = document.getElementById('player-list');
      list.innerHTML = '';
      const players = playersArray();
      players.forEach(p => {
        const li = document.createElement('li');
        li.className = 'player-item';

        let statusBadge = '';
        if (!p.active) {
          statusBadge = '<span class="status-badge badge-out">脱落</span>';
        } else if (p.answer !== null && p.answer !== undefined) {
          statusBadge = '<span class="status-badge badge-answered">入力済</span>';
        } else {
          statusBadge = '<span class="status-badge badge-thinking">入力中</span>';
        }

        const giverBadge = p.id === latestGame.promptGiverId
          ? '<span class="status-badge badge-giver">★出題者</span>'
          : '';

        li.innerHTML = `
          <div class="player-info">
            <span><strong>${escapeHtml(p.name || 'ゲスト')}</strong></span>
            ${giverBadge}
          </div>
          <div>
            <span style="margin-right: 8px; font-weight: bold;">${p.score || 0}pt</span>
            ${statusBadge}
          </div>
        `;
        list.appendChild(li);
      });

      const isJoined = !!latestPlayers[myPlayerId];
      document.getElementById('join-btn').disabled = isJoined;
      document.getElementById('leave-btn').disabled = !isJoined;

      const activeCount = players.filter(p => p.active && p.name).length;
      document.getElementById('start-btn').disabled = !(latestGame.phase === 'lobby' && activeCount >= 2);

      const isPromptGiver = latestGame.promptGiverId === myPlayerId;
      const me = latestPlayers[myPlayerId];
      const isMyTurnAnswer = me && me.active && (me.answer === null || me.answer === undefined);

      document.getElementById('prompt-btn').disabled = !(latestGame.phase === 'prompt' && isPromptGiver);
      document.getElementById('prompt-input').disabled = !(latestGame.phase === 'prompt' && isPromptGiver);
      
      document.getElementById('answer-btn').disabled = !(latestGame.phase === 'answer' && isMyTurnAnswer);
      document.getElementById('answer-input').disabled = !(latestGame.phase === 'answer' && isMyTurnAnswer);

      if (typeof latestGame.logSeq === 'number' && latestGame.logSeq !== lastLogSeq && latestGame.log) {
        lastLogSeq = latestGame.logSeq;
        const logElem = document.getElementById('log');
        logElem.textContent += latestGame.log + '\n----------------\n';
        logElem.scrollTop = logElem.scrollHeight;
      }
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function joinGame() {
      const name = document.getElementById('username').value.trim();
      const finalName = name || ('Player_' + myPlayerId.slice(-4));
      db.ref('players/' + myPlayerId).set({
        name: finalName,
        score: 0,
        active: true,
        answer: null
      }).then(() => {
        armDisconnectHook();
        appendLog(finalName + ' が参加しました。');
      });
    }

    // 手動で退室する処理
    function leaveGame() {
      const me = latestPlayers[myPlayerId];
      const name = me ? me.name : 'プレイヤー';
      db.ref('players/' + myPlayerId).remove().then(() => {
        appendLog(name + ' が退室しました。');
      });
    }

    // 詰まったとき用のルーム初期化処理
    function resetRoom() {
      if (!confirm('部屋の状態とプレイヤー一覧をリセットしますか？')) return;
      
      const updates = {};
      updates['game'] = {
        phase: 'lobby',
        round: 0,
        prompt: '',
        promptGiverId: null,
        endTime: 0,
        log: 'ルームがリセットされました。',
        logSeq: ((latestGame && latestGame.logSeq) || 0) + 1
      };
      updates['players'] = null;

      db.ref().update(updates);
    }

    function startGame() {
      const players = playersArray();
      const eligible = players.filter(p => p.name);
      if (latestGame.phase !== 'lobby' || eligible.length < 2) return;

      const updates = {};

      // 非アクティブ（切断済み等）のプレイヤーを削除
      players.forEach(p => {
        if (!p.active) {
          updates['players/' + p.id] = null;
        }
      });

      eligible.forEach(p => {
        updates['players/' + p.id + '/score'] = 0;
        updates['players/' + p.id + '/active'] = true;
        updates['players/' + p.id + '/answer'] = null;
      });

      updates['game/round'] = 1;
      updates['game/phase'] = 'prompt';
      updates['game/promptGiverId'] = eligible[0].id;
      updates['game/prompt'] = '';
      updates['game/endTime'] = Date.now() + (TIME_LIMIT_PROMPT * 1000);
      bumpLog(updates, 'ゲームを開始します！第1ラウンド開始。');

      db.ref().update(updates);
    }

    function submitPrompt() {
      const promptText = document.getElementById('prompt-input').value.trim();
      if (!latestGame || latestGame.phase !== 'prompt' || latestGame.promptGiverId !== myPlayerId) return;

      const finalPrompt = promptText || DEFAULT_PROMPTS[Math.floor(Math.random() * DEFAULT_PROMPTS.length)];

      const updates = {};
      updates['game/prompt'] = finalPrompt;
      updates['game/phase'] = 'answer';
      updates['game/endTime'] = Date.now() + (TIME_LIMIT_ANSWER * 1000);
      playersArray().forEach(p => {
        updates['players/' + p.id + '/answer'] = null;
      });
      bumpLog(updates, `お題: 「${finalPrompt}」 が設定されました！回答を入力してください。`);

      db.ref().update(updates);
      document.getElementById('prompt-input').value = '';
    }

    function submitAnswer() {
      const answerText = document.getElementById('answer-input').value.trim() || '(無回答)';
      const me = latestPlayers[myPlayerId];
      if (!latestGame || latestGame.phase !== 'answer' || !me || !me.active) return;
      if (me.answer !== null && me.answer !== undefined) return;

      db.ref('players/' + myPlayerId + '/answer').set(answerText).then(() => {
        appendLog(`${me.name} が回答を送信しました。`);
        setTimeout(maybeActAsJudge, 300);
      });
      document.getElementById('answer-input').value = '';
    }

    function bumpLog(updates, message) {
      const nextSeq = ((latestGame && latestGame.logSeq) || 0) + 1;
      updates['game/log'] = message;
      updates['game/logSeq'] = nextSeq;
    }

    function appendLog(message) {
      const nextSeq = ((latestGame && latestGame.logSeq) || 0) + 1;
      db.ref('game').update({ log: message, logSeq: nextSeq });
    }

    function maybeHandleTimeout() {
      if (!latestGame || Date.now() < latestGame.endTime) return;
      if (!isPrimaryJudge()) return;

      if (latestGame.phase === 'prompt') {
        const randomPrompt = DEFAULT_PROMPTS[Math.floor(Math.random() * DEFAULT_PROMPTS.length)];
        const updates = {};
        updates['game/prompt'] = randomPrompt;
        updates['game/phase'] = 'answer';
        updates['game/endTime'] = Date.now() + (TIME_LIMIT_ANSWER * 1000);
        playersArray().forEach(p => {
          updates['players/' + p.id + '/answer'] = null;
        });
        bumpLog(updates, `⏰ 制限時間切れ！自動お題: 「${randomPrompt}」 が設定されました！`);
        db.ref().update(updates);
      } else if (latestGame.phase === 'answer') {
        maybeActAsJudge(true);
      }
    }

    function isPrimaryJudge() {
      const actives = playersArray().filter(p => p.active);
      if (actives.length === 0) return false;

      const giverIsActive = actives.some(p => p.id === latestGame.promptGiverId);
      const judgeId = giverIsActive
        ? latestGame.promptGiverId
        : actives.slice().sort((a, b) => a.id.localeCompare(b.id))[0].id;

      return judgeId === myPlayerId;
    }

    let judging = false;
    function maybeActAsJudge(forceTimeout = false) {
      if (!latestGame || latestGame.phase !== 'answer') return;
      if (judging) return;
      if (!isPrimaryJudge()) return;

      const actives = playersArray().filter(p => p.active);
      if (actives.length === 0) return;

      const allAnswered = actives.every(p => p.answer !== null && p.answer !== undefined);
      if (!allAnswered && !forceTimeout) return;

      judging = true;

      if (forceTimeout && !allAnswered) {
        actives.forEach(p => {
          if (p.answer === null || p.answer === undefined) {
            p.answer = '(時間切れ)';
          }
        });
      }

      runJudgement(actives).finally(() => { judging = false; });
    }

    function runJudgement(actives) {
      const counts = {};
      actives.forEach(p => {
        const key = (p.answer || '').toLowerCase();
        if (key && key !== '(時間切れ)') {
          counts[key] = (counts[key] || 0) + 1;
        }
      });

      const scoredNames = [];
      const updates = {};
      actives.forEach(p => {
        const key = (p.answer || '').toLowerCase();
        if (key && key !== '(時間切れ)' && counts[key] >= 2) {
          updates['players/' + p.id + '/score'] = (p.score || 0) + 1;
          scoredNames.push(p.name);
        }
      });

      let log = '【結果発表】\n';
      actives.forEach(p => { log += `・${p.name}: 「${p.answer}」\n`; });
      log += scoredNames.length === 0
        ? '一致した人はいませんでした。\n'
        : `一致してポイント獲得(+1pt): ${scoredNames.join(', ')}\n`;

      const projected = actives.map(p => ({
        ...p,
        score: updates['players/' + p.id + '/score'] !== undefined
          ? updates['players/' + p.id + '/score']
          : (p.score || 0)
      }));

      const currentRound = latestGame.round || 1;

      if (currentRound % 5 === 0 && projected.length > 1) {
        const minScore = Math.min(...projected.map(p => p.score));
        const lowest = projected.filter(p => p.score === minScore);
        if (lowest.length < projected.length) {
          lowest.forEach(p => { updates['players/' + p.id + '/active'] = false; });
          log += `【脱落】5ラウンド経過！最下位の ${lowest.map(p => p.name).join(', ')} が脱落しました。\n`;
        }
      }

      const eliminatedIds = new Set(
        Object.keys(updates)
          .filter(k => k.endsWith('/active') && updates[k] === false)
          .map(k => k.split('/')[1])
      );
      const remaining = projected.filter(p => !eliminatedIds.has(p.id));

      if (remaining.length <= 1) {
        updates['game/phase'] = 'game_over';
        updates['game/endTime'] = 0;
        const winner = remaining[0] ? remaining[0].name : '該当者なし';
        log += `\n【ゲーム終了】勝者: ${winner}！`;
      } else {
        const nextRound = currentRound + 1;
        const nextGiver = remaining[(nextRound - 1) % remaining.length];
        updates['game/round'] = nextRound;
        updates['game/phase'] = 'prompt';
        updates['game/promptGiverId'] = nextGiver.id;
        updates['game/prompt'] = '';
        updates['game/endTime'] = Date.now() + (TIME_LIMIT_PROMPT * 1000);
      }

      bumpLog(updates, log);
      return db.ref().update(updates);
    }
  </script>
